<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with safe rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#334155" stroke-width="3" opacity="0.4" />
  
  <!-- Calisthenics Push-Up & Flame Emblem -->
  <!-- Subtle circular energy ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="12" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#amberGrad)" stroke-width="12" stroke-dasharray="1068" stroke-dashoffset="350" stroke-linecap="round" />
  
  <!-- Athlete in strong push-up plank pose -->
  <!-- Head -->
  <circle cx="160" cy="205" r="32" fill="url(#amberGrad)" filter="url(#glow)" />
  <!-- Torso / Spine line -->
  <path d="M 185 220 L 320 280 L 410 330" fill="none" stroke="url(#amberGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arms supporting -->
  <path d="M 215 233 L 205 330 L 235 330" fill="none" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Ground floor bar -->
  <line x1="120" y1="344" x2="440" y2="344" stroke="#475569" stroke-width="14" stroke-linecap="round" />
  
  <!-- "182" or Spark indicator -->
  <circle cx="370" cy="180" r="14" fill="#fbbf24" />
  <circle cx="395" cy="155" r="8" fill="#fbbf24" opacity="0.8" />
  <circle cx="410" cy="195" r="6" fill="#fbbf24" opacity="0.6" />
</svg>
